name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only needs to read the code, whatever the repository default is.
permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Bundle the app
        run: ./scripts/build-app.sh
